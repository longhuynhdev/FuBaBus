# URI is injected via environment variable at runtime
# spring.data.mongodb.* was replaced by spring.mongodb.* in Spring Boot 4
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE}

# Redis — defaults to the Docker Compose service name "redis";
# override REDIS_HOST (e.g. to "localhost") when running outside compose
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
