spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring Boot 4 moved this out of spring-boot-autoconfigure into the spring-boot-data-redis
# module and renamed it (was org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration).
# An unresolvable class name here fails startup, so the FQN has to track the new one.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

# Output ANSI colors
spring.output.ansi.enabled=always