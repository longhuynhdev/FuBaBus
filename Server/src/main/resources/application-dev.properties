# Configuration for Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Configuration for MongoDB
# Spring Boot 4 moved the connection properties from spring.data.mongodb.* to spring.mongodb.*.
# The old keys are no longer bound at all — they fail silently and leave the driver on its
# localhost defaults with no credentials.
spring.mongodb.authentication-database=admin
spring.mongodb.username=mongo
spring.mongodb.password=mongo
spring.mongodb.port=27017
spring.mongodb.host=localhost
spring.mongodb.database=FuBaBus
