name: fubabus

services:
  # ─── Spring Boot Application ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fubabus-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Without this the container generates a random signing key on every start,
      # logging every user out on each redeploy.
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Redis (Seat Reservation Cache) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # Enable password auth, AOF persistence, and keyspace expiry notifications (required for KeyExpirationListener)
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --notify-keyspace-events Ex
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Do NOT expose port 6379 to the host — only the app container needs it
    expose:
      - "6379"

volumes:
  redis_data:
